[core]
default_team = "sc-dev"
identity = "team-lead"

[[atm.post_send_hooks]]
recipient = "csc"
command = [".claude/scripts/atm-nudge.sh", "csc"]

[plugins.gh_monitor]
team = "sc-dev"
repo = "randlee/synaptic-canvas-dolt"
notify_target = ["team-lead@sc-dev"]

# ── rmux: tmux session launcher ──────────────────────────────────────
[rmux]
session = "sc-dev"

[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
model = "sonnet"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "sc-dev" }

[[rmux.windows.panes]]
name = "csc"
command = "codex --yolo"
env = { ATM_IDENTITY = "csc", ATM_TEAM = "sc-dev" }

[[rmux.windows.panes]]
name = "quality-mgr"
model = "sonnet"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "sc-dev" }

[[rmux.windows]]
name = "monitoring"
layout = "even-vertical"

[[rmux.windows.panes]]
name = "logs"
command = "tail -f /tmp/atm.log"

[[rmux.windows.panes]]
name = "term"
