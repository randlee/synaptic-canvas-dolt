<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentation — synaptic-canvas-dolt</title>
<style>
:root { --bg:#0d1117; --fg:#c9d1d9; --accent:#58a6ff; --border:#21262d; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--fg); line-height:1.6; }
.container { max-width:900px; margin:0 auto; padding:3rem 1.5rem; }
h1,h2,h3 { color:var(--accent); }
h2 { border-bottom:1px solid var(--border); padding-bottom:.4rem; margin-top:2rem; }
a { color:var(--accent); }
code { background:#161b22; padding:1px 5px; border-radius:3px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.85em; }
pre { background:#161b22; padding:1rem; border-radius:6px; overflow-x:auto; border:1px solid var(--border); }
pre code { background:none; padding:0; }
table { border-collapse:collapse; width:100%; margin:1rem 0; }
th,td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
th { background:#161b22; }
blockquote { border-left:3px solid var(--accent); margin:1rem 0; padding:0 1rem; color:#8b949e; }
.breadcrumb { color:#8b949e; font-size:.9rem; margin-bottom:1.5rem; }
</style>
</head>
<body>
<div class="container">
  <div class="breadcrumb"><a href="index.html">← Documentation</a> · <a href="../">Synaptic Canvas</a></div>
  <div id="content">Loading…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  var doc = new URLSearchParams(window.location.search).get('doc') || 'multi-harness-skill-package.md';
  document.title = doc.replace(/\.md$/, '') + ' — synaptic-canvas-dolt';
  fetch(doc)
    .then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(md) {
      document.getElementById('content').innerHTML = marked.parse(md);
    })
    .catch(function(e) {
      document.getElementById('content').innerHTML = '<p>Failed to load <code>' + doc + '</code>: ' + e.message + '</p>';
    });
})();
</script>
</body>
</html>
