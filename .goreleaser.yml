version: 2

project_name: sc

builds:
  - id: sc
    dir: ./src
    binary: sc
    env:
      - CGO_ENABLED=0
    tags:
      - production
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: sc
    repository:
      owner: randlee
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/randlee/synaptic-canvas-dolt"
    description: "Dolt-backed package manager for Claude Code skills"
    license: "MIT"

winget:
  - name: sc
    publisher: randlee
    short_description: "Dolt-backed package manager for Claude Code skills"
    license: "MIT"
    publisher_url: "https://github.com/randlee/synaptic-canvas-dolt"
    repository:
      owner: randlee
      name: winget-pkgs
      branch: "update-{{.Version}}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
